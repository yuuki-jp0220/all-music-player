<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Music Player</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131b;color:white;
 font-family:Arial,"Noto Sans JP",sans-serif;
}
header{
 padding:22px 18px;text-align:center;
 background:#191e2b;
}
header h1{margin:0;font-size:25px}
header p{color:#aab2c5;font-size:13px}
main{max-width:760px;margin:auto;padding:18px}
.panel{
 background:#1c2230;padding:17px;
 border-radius:16px;margin-bottom:16px;
}
input{
 width:100%;padding:15px;border:1px solid #414b60;
 background:#101622;color:white;border-radius:10px;
 font-size:15px;outline:none;
}
button{
 border:0;border-radius:10px;padding:13px;
 background:#6578ff;color:white;
 font-size:15px;font-weight:bold;cursor:pointer;
}
button:active{opacity:.7}
.playbtn{width:100%;margin-top:12px}
.services{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:9px;margin-top:12px;
}
.services button{background:#30394d}
.services button:last-child{grid-column:span 2}
#player{
 width:100%;aspect-ratio:16/9;
 border:0;border-radius:12px;background:#080b11;
}
#player.audio{aspect-ratio:auto;height:380px}
#status{color:#aab2c5;font-size:13px;margin:12px 0}
#open{
 display:inline-block;color:#aabaff;margin-top:12px;
}
.hidden{display:none}
footer{text-align:center;color:#778198;font-size:12px;padding:25px}
</style>
</head>
<body>

<header>
<h1>🎵 All Music Player</h1>
<p>いろいろな動画・音楽サービスをひとつに</p>
</header>

<main>
<div class="panel">
<h3>🔗 URLを入力</h3>
<input id="url" type="url"
placeholder="動画・音楽のリンクを貼り付け">

<button class="playbtn" onclick="playURL()">
▶ 再生する
</button>

<div class="services">
<button onclick="setSite('https://www.youtube.com/')">▶ YouTube</button>
<button onclick="setSite('https://music.youtube.com/')">🎵 YouTube Music</button>
<button onclick="setSite('https://open.spotify.com/')">🟢 Spotify</button>
<button onclick="setSite('https://music.apple.com/jp/browse')">🍎 Apple Music</button>
<button onclick="setSite('https://www.nicovideo.jp/')">🎬 ニコニコ動画</button>
</div>
</div>

<div class="panel">
<h3 id="title">🎧 プレイヤー</h3>
<div id="status">再生したいURLを入力してください。</div>
<p id="hostNotice" style="color:#f0c878;font-size:12px;line-height:1.6;margin:8px 0 0;"></p>
<iframe id="player"
class="hidden"
allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
allowfullscreen
referrerpolicy="strict-origin-when-cross-origin"
 title="動画・音楽プレイヤー">
</iframe>
<a id="open" class="hidden" target="_blank"
rel="noopener">元のサービスで開く ↗</a>
</div>

<div class="panel">
<h3>使い方</h3>
<p>① YouTubeなどで動画・音楽を開く</p>
<p>② 共有からリンクをコピー</p>
<p>③ ここに貼り付けて再生！</p>
</div>
</main>

<footer>
All Music Player / HTML Version 1.0
</footer>

<script>
const urlInput=document.getElementById("url");
const player=document.getElementById("player");
const statusText=document.getElementById("status");
const title=document.getElementById("title");
const openLink=document.getElementById("open");

function setSite(url){
 urlInput.value=url;
 urlInput.focus();
}

function playURL(){
 const raw=urlInput.value.trim();

 if(!raw){
  statusText.textContent="URLを入力してください。";
  return;
 }

 let u;
 try{
  u=new URL(raw);
  if(!["http:","https:"].includes(u.protocol))throw 0;
 }catch(e){
  statusText.textContent="正しいURLを入力してください。";
  return;
 }

 const host=u.hostname.toLowerCase();
 const path=u.pathname;
 let embed="";
 let service="";
 let audio=false;

 // YouTube / YouTube Music
 if(
  host==="youtube.com"||
  host==="www.youtube.com"||
  host==="m.youtube.com"||
  host==="music.youtube.com"||
  host==="youtu.be"||
  host==="www.youtu.be"
 ){
  let id="";
  if(host.includes("youtu.be")){
   id=path.slice(1).split("/")[0];
  }else if(path==="/watch"){
   id=u.searchParams.get("v")||"";
  }else{
   const match=path.match(/\/(shorts|embed|live)\/([^/?]+)/);
   if(match)id=match[2];
  }

  if(id){
   embed="https://www.youtube.com/embed/"+encodeURIComponent(id);
    if(location.protocol==="https:"||location.protocol==="http:"){
     embed+="?origin="+encodeURIComponent(location.origin)+"&playsinline=1";
    }
   const list=u.searchParams.get("list");
   if(list)embed+=(embed.includes("?")?"&":"?")+"list="+encodeURIComponent(list);
  }else{
   const list=u.searchParams.get("list");
   if(list){
    embed="https://www.youtube.com/embed/videoseries?list="+encodeURIComponent(list);
     if(location.protocol==="https:"||location.protocol==="http:"){
      embed+="&origin="+encodeURIComponent(location.origin)+"&playsinline=1";
     }
   }
  }
  service="YouTube";
 }

 // Spotify
 else if(host==="open.spotify.com"||
         host==="www.open.spotify.com"){
  const parts=path.split("/").filter(Boolean);
  if(parts.length>=2){
   embed="https://open.spotify.com/embed/"+
    parts.slice(0,2).map(encodeURIComponent).join("/");
   audio=true;
  }
  service="Spotify";
 }

 // Apple Music
 else if(host==="music.apple.com"||
         host==="www.music.apple.com"||
         host==="embed.music.apple.com"){
  embed="https://embed.music.apple.com"+path+u.search;
  audio=true;
  service="Apple Music";
 }

 // ニコニコ動画
 else if(host==="www.nicovideo.jp"||
         host==="nicovideo.jp"){
  const match=path.match(/\/watch\/([a-zA-Z0-9]+)/);
  if(match){
   embed="https://embed.nicovideo.jp/watch/"+
    encodeURIComponent(match[1]);
  }
  service="ニコニコ動画";
 }

 else{
  service="未対応のサービス";
 }

 openLink.href=u.href;
 openLink.classList.remove("hidden");

 if(!embed){
  player.classList.add("hidden");
  statusText.textContent=
   service+"：埋め込みに対応していないURLです。元のサイトで開いてください。";
  return;
 }

 player.src=embed;
 player.classList.remove("hidden");
 player.classList.toggle("audio",audio);

 title.textContent="🎧 "+service;
 statusText.textContent=
  service+" のプレイヤーを読み込みました。再生ボタンを押してください。";
  if(service==="YouTube" && location.protocol==="file:"){
   statusText.textContent="YouTubeを再生するにはHTTPSまたはlocalhostで開いてください（file://ではエラー153になることがあります）。";
  }
}

urlInput.addEventListener("keydown",e=>{
 if(e.key==="Enter")playURL();
});
</script>

</body>
</html>
